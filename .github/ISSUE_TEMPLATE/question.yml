name: Question
description: Ask a question about using or contributing to Gabby.
labels: [question]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to do, and what have you tried?
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
