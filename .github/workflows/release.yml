name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: gabby-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  starter-bundles:
    needs: [build, client-sdks]
    if: ${{ vars.GABBY_STARTER_BUNDLE_SIGNING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: starter-bundle-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen --extra skill-signing
      - name: Build and verify signed starter bundles
        env:
          GABBY_STARTER_SIGNING_KEY: ${{ secrets.GABBY_STARTER_SIGNING_KEY }}
          GABBY_STARTER_SIGNING_KEY_ID: ${{ vars.GABBY_STARTER_SIGNING_KEY_ID }}
        run: uv run --no-sync python scripts/build_starter_bundles.py --output dist/starter-bundles
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gabby-signed-starter-bundles-${{ github.ref_name }}
          path: dist/starter-bundles/
          if-no-files-found: error
          retention-days: 90
      - name: Attach starter bundles to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find dist/starter-bundles -type f -print0)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No starter bundle assets were generated" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes
          fi

  platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.13.5
      - if: runner.os != 'Windows'
        run: uv sync --frozen --group dev --extra server --extra auth --extra skill-signing --python '${{ matrix.python-version }}'
      - if: runner.os == 'Windows'
        run: uv sync --frozen --group dev --extra server --extra auth --extra skill-signing --extra windows-sandbox --python '${{ matrix.python-version }}'
      - run: uv run --no-sync pytest --cov=gabby --cov-report=term-missing

  sandbox-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen --group dev --extra server --extra auth --extra skill-signing --python '3.14'
      - name: Start and verify Docker daemon
        run: |
          sudo systemctl start docker
          docker info
      - name: Verify Docker and Podman sandbox contracts
        env:
          GABBY_RUN_DOCKER_INTEGRATION: "1"
          GABBY_RUN_PODMAN_INTEGRATION: "1"
        run: >-
          uv run --no-sync pytest
          tests/integration/test_docker_sandbox_live.py
          tests/integration/test_podman_sandbox_live.py -q

  deployment-container:
    uses: ./.github/workflows/container-validation.yml

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen --group dev --extra server --extra auth --extra skill-signing --extra windows-sandbox --python '${{ matrix.python-version }}'
      - run: uv lock --check
      - run: uv run --no-sync ruff check src tests scripts examples
      - run: uv run --no-sync ruff format --check src tests scripts examples
      - run: uv run --no-sync mypy --python-version '${{ matrix.python-version }}' src/gabby tests scripts examples
      - run: uv run --no-sync python scripts/check_license_headers.py
      - run: uv run --no-sync python scripts/check_workflows.py
      - run: uv run --no-sync python scripts/check_scorecard.py
      - run: uv run --no-sync python scripts/check_documentation.py
      - run: uv run --no-sync python scripts/check_release.py "$GITHUB_REF_NAME"
      - run: uv run --no-sync pytest --cov=gabby --cov-report=term-missing --cov-report=xml
      - run: uv build --out-dir dist
      - run: uv run --no-sync python scripts/check_package.py dist
      - run: uv run --no-sync pip-audit --skip-editable --progress-spinner off

  build:
    needs: [platform, quality, sandbox-live, deployment-container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm tag matches the package version
        run: python scripts/check_release.py "$GITHUB_REF_NAME"
      - name: Confirm tag commit is on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.13.5
      - run: uv build --out-dir dist
      - name: Verify release archive contents and license
        run: python scripts/check_package.py dist
      - name: Attest release distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Generate runtime dependency SBOM
        run: >-
          mkdir -p sbom && uv export --frozen --no-dev --extra server --extra auth --preview-features sbom-export
          --format cyclonedx1.5 --output-file sbom/gabby-runtime-sbom.cdx.json
      - name: Attest wheel with runtime SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
          sbom-path: sbom/gabby-runtime-sbom.cdx.json
      - name: Attest source distribution with runtime SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
          sbom-path: sbom/gabby-runtime-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gabby-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gabby-runtime-sbom
          path: sbom/gabby-runtime-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  client-sdks:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package TypeScript, Go, and Rust clients
        run: |
          mkdir -p dist/client-sdks
          tar -czf "dist/client-sdks/gabby-typescript-sdk-${GITHUB_REF_NAME}.tar.gz" -C sdks/typescript .
          tar -czf "dist/client-sdks/gabby-go-sdk-${GITHUB_REF_NAME}.tar.gz" -C sdks/go .
          tar --exclude=./target -czf "dist/client-sdks/gabby-rust-sdk-${GITHUB_REF_NAME}.tar.gz" -C sdks/rust .
      - name: Attach client SDK archives to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find dist/client-sdks -type f -print0)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/gabby-agent-runtime
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@fd7ae8fda6dc16277a9ffbc91cdb0eedf156e912 # v7.0.0
        with:
          name: gabby-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
