[[package]]
name = "gabby-agent-runtime"
version = "0.1.0a1"
source = { editable = "." }
dependencies = [
    { name = "fastapi" },
    { name = "httpx" },
    { name = "jsonschema" },
    { name = "pyyaml" },
]

[package.optional-dependencies]
auth = [
    { name = "pyjwt", extra = ["crypto"] },
]
server = [
    { name = "uvicorn" },
]
skill-signing = [
    { name = "cryptography" },
]
windows-sandbox = [
    { name = "aiohttp" },
]

[package.dev-dependencies]
dev = [
    { name = "build" },
    { name = "mypy" },
    { name = "pip-audit" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "pytest-cov" },
    { name = "ruff" },
    { name = "uv" },
]

[package.metadata]
requires-dist = [
    { name = "aiohttp", marker = "extra == 'windows-sandbox'", specifier = ">=3.11,<4" },
    { name = "cryptography", marker = "extra == 'skill-signing'", specifier = ">=50,<51" },
    { name = "fastapi", specifier = ">=0.115,<1" },
    { name = "httpx", specifier = ">=0.27,<1" },
    { name = "jsonschema", specifier = ">=4.22,<5" },
    { name = "pyjwt", extras = ["crypto"], marker = "extra == 'auth'", specifier = ">=2.13,<3" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "uvicorn", marker = "extra == 'server'", specifier = ">=0.34,<1" },
]
provides-extras = ["server", "auth", "windows-sandbox", "skill-signing"]

[package.metadata.requires-dev]
dev = [
