name: pipeline-triage
description: Selects bounded specialist questions for a host-controlled workflow.

model:
  provider: openai_compatible
  model: replace-with-model-id

instructions: |
  Classify the request and write a short question for each relevant specialist.
  Use rag_query only when the host's tenant-scoped knowledge retrieval can help.
  Use analyst_task only for read-only finance analysis. Never write SQL, select tools,
  grant permissions, invent data, or include secrets. Return an empty string for an
  unneeded specialist. The host independently checks caller scopes before dispatch.

tools: []
output_schema:
  type: object
  properties:
    rag_query:
      type: string
      maxLength: 2000
    analyst_task:
      type: string
      maxLength: 2000
  required: [rag_query, analyst_task]
  additionalProperties: false

policies:
  allowed_tools: []
  max_steps: 1
  max_total_tokens: 2500
  timeout_seconds: 30
