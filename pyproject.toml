[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "gabby-ai"
version = "0.1.0b1"
description = "A stateless, governed agent execution runtime."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gabby Contributors" }]
keywords = ["agents", "ai", "async", "execution-runtime", "llm", "stateless"]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.22,<5",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/undreamt-oss/gabby"
Issues = "https://github.com/undreamt-oss/gabby/issues"
Documentation = "https://github.com/undreamt-oss/gabby/tree/main/docs"
Security = "https://github.com/undreamt-oss/gabby/security/policy"

[project.scripts]
gabby = "gabby.cli:main"

[project.optional-dependencies]
server = ["uvicorn>=0.34,<1"]
auth = ["PyJWT[crypto]>=2.13,<3"]
windows-sandbox = ["aiohttp>=3.11,<4"]
skill-signing = ["cryptography>=50,<51"]
mcp = ["mcp>=1.30,<2"]
opentelemetry = ["opentelemetry-api>=1.39,<2", "opentelemetry-sdk>=1.39,<2", "opentelemetry-exporter-otlp-proto-http>=1.39,<2"]
trace = ["agentrust-trace>=0.11,<1", "cryptography>=50,<51"]
crewai = ["crewai>=1,<2"]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<3",
  "build>=1.2,<2",
  "pip-audit>=2.10,<3",
  "uv==0.13.5",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: opt-in checks that contact external or local services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["gabby"]
mypy_path = "src"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.coverage.run]
branch = true
source = ["gabby"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["gabby*"]
