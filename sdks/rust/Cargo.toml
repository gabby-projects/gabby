[package]
name = "gabby-client"
version = "0.1.0-beta.1"
edition = "2021"
license = "Apache-2.0"
description = "Lightweight HTTP and SSE client for Gabby"

[dependencies]
async-stream = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
